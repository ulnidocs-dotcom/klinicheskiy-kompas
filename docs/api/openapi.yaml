openapi: 3.1.0
info:
  title: Клинический компас — API платформы
  version: 0.1.0
  description: |
    Контракт сервера для мини-приложений MAX и Telegram и веб-кабинетов. Сервер — источник истины.
    Пациент видит только свои данные; врач и психолог — пациентов по связи care_relations.
    Спек: docs/superpowers/specs/2026-10-21-max-messenger-design.md.
servers:
  - url: https://api.example.ru
security:
  - session: []
paths:
  /v1/auth/max:
    post:
      summary: Вход из мини-приложения MAX
      description: |
        Сервер проверяет initData: secret = HMAC-SHA256(key "WebAppData", msg BOT_TOKEN);
        подпись = hex(HMAC-SHA256(secret, пары без hash, отсортированные по ключу, через \n)); auth_date не старше 3600 с.
        initDataUnsafe не используется. Эталон: tools/max-initdata.js.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [initData], properties: { initData: { type: string } } }
      responses:
        '200': { description: Сессия, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { description: Неверная подпись или устаревшая auth_date }
  /v1/auth/telegram:
    post:
      summary: Вход из Telegram Mini App (та же схема, ключ по правилам Telegram)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [initData], properties: { initData: { type: string } } }
      responses:
        '200': { description: Сессия, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { description: Неверная подпись }
  /v1/invites/{token}:redeem:
    post:
      summary: Погасить приглашение врача (startapp=inv_<token>), привязать канал
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,64}$' } }
      responses:
        '200': { description: Канал привязан, content: { application/json: { schema: { $ref: '#/components/schemas/Channel' } } } }
        '410': { description: Приглашение использовано или истекло (72 часа) }
  /v1/link-codes:
    post:
      summary: Создать код переезда на сайт (6 цифр, 10 минут, одно гашение)
      responses:
        '201':
          description: Код
          content:
            application/json:
              schema: { type: object, properties: { code: { type: string, pattern: '^\d{6}$' }, expiresAt: { type: string, format: date-time } } }
  /v1/link-codes:redeem:
    post:
      summary: Погасить код на сайте — привязать веб-канал к тому же пациенту
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string, pattern: '^\d{6}$' } } }
      responses:
        '200': { description: Сессия веб-кабинета, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '404': { description: Код не найден }
        '410': { description: Код использован или истёк }
        '429': { description: Слишком много попыток с одного адреса }
  /v1/patients/{id}/channels:
    get:
      summary: Подключённые каналы пациента
      parameters: [{ $ref: '#/components/parameters/PatientId' }]
      responses:
        '200': { description: Каналы, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Channel' } } } } }
  /v1/patients/{id}/channels/{channel}:
    delete:
      summary: Отключить канал (история остаётся)
      parameters:
        - { $ref: '#/components/parameters/PatientId' }
        - { name: channel, in: path, required: true, schema: { $ref: '#/components/schemas/ChannelName' } }
      responses:
        '204': { description: Отключён }
  /v1/patients/{id}/events:batch:
    post:
      summary: Пакет событий из очереди клиента; повтор с тем же clientId не создаёт дубль
      parameters: [{ $ref: '#/components/parameters/PatientId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [events], properties: { events: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/EventIn' } } } }
      responses:
        '200':
          description: Результат по каждому событию
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    clientId: { type: string }
                    status: { type: string, enum: [accepted, duplicate, rejected] }
                    reason: { type: string }
                    event: { $ref: '#/components/schemas/Event' }
  /v1/patients/{id}/events:
    get:
      summary: События после отметки времени (кабинеты, второй канал пациента)
      parameters:
        - { $ref: '#/components/parameters/PatientId' }
        - { name: since, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: События, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Event' } } } } }
  /v1/patients/{id}/export:
    get:
      summary: Пакет kompas-bundle v1 (переезд, право пациента на свои данные)
      parameters: [{ $ref: '#/components/parameters/PatientId' }]
      responses:
        '200': { description: Пакет, content: { application/json: { schema: { $ref: '#/components/schemas/Bundle' } } } }
  /v1/max/webhook:
    post:
      summary: Обновления бота MAX (message_callback от кнопки «Принял», bot_started)
      description: Подписка через POST /subscriptions Bot API MAX. Типы обновлений сверить с dev.max.ru/docs-api.
      security: [{ webhookSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Принято }
  /v1/auth/otp:
    post:
      summary: Запросить одноразовый код (6 цифр, 5 минут) на телефон — вход и регистрация пациента
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [phone, purpose], properties: { phone: { type: string, pattern: '^\+7\d{10}$' }, purpose: { type: string, enum: [patient_login, patient_register] } } }
      responses:
        '202': { description: Код отправлен (ответ одинаковый для любого номера) }
        '429': { description: Слишком много запросов с номера или адреса }
  /v1/auth/otp:verify:
    post:
      summary: Проверить код; не больше 5 попыток, после успеха код сгорает
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [phone, purpose, code], properties: { phone: { type: string }, purpose: { type: string }, code: { type: string, pattern: '^\d{6}$' } } }
      responses:
        '200': { description: Сессия пациента или подтверждение телефона, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { description: 'Код неверный (с числом оставшихся попыток), истёк или попытки исчерпаны' }
  /v1/auth/login:
    post:
      summary: Вход специалиста — почта и пароль; ответ требует второй фактор
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string } } }
      responses:
        '200': { description: 'Нужен второй фактор', content: { application/json: { schema: { type: object, properties: { mfaToken: { type: string } } } } } }
        '401': { description: 'Одинаковый ответ для неверной пары, неизвестной почты и заблокированного сотрудника' }
  /v1/auth/mfa:verify:
    post:
      summary: Второй фактор специалиста
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [mfaToken, code], properties: { mfaToken: { type: string }, code: { type: string, pattern: '^\d{6}$' } } }
      responses:
        '200': { description: Сессия специалиста, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { description: Код неверный или истёк }
  /v1/auth/recover:
    post:
      summary: Ссылка восстановления на рабочую почту (30 минут, одно использование)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '202': { description: Ответ одинаковый, есть такая почта или нет }
  /v1/auth/recover:complete:
    post:
      summary: Новый пароль по ссылке после второго фактора
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token, code, password], properties: { token: { type: string }, code: { type: string }, password: { type: string, minLength: 10 } } }
      responses:
        '204': { description: Пароль обновлён, остальные сессии сотрудника завершены }
        '410': { description: Ссылка недействительна }
  /v1/staff-invites:
    post:
      summary: Пригласить сотрудника (только администратор клиники)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, role], properties: { email: { type: string, format: email }, role: { type: string, enum: [doctor, psychologist, admin] } } }
      responses:
        '201': { description: Приглашение создано, письмо отправлено (72 часа, одно использование) }
        '409': { description: Сотрудник с этой почтой уже есть }
  /v1/staff-invites/{token}:
    get:
      summary: Сведения о приглашении (клиника, роль, почта, срок, состояние)
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: 'Состояние: pending, expired, used, revoked' }
        '404': { description: Не найдено }
    delete:
      summary: Отозвать приглашение
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Отозвано }
  /v1/staff-invites/{token}:accept:
    post:
      summary: Принять приглашение — профиль, пароль (хранится только хэш Argon2id), подтверждённый телефон, обязательство
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, password, otp, pledge]
              properties:
                name: { type: string }
                specialty: { type: string }
                phone: { type: string }
                password: { type: string, minLength: 10 }
                otp: { type: string }
                pledge: { const: true }
      responses:
        '200': { description: Сессия нового сотрудника, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '410': { description: Приглашение истекло, использовано или отозвано }
  /v1/staff-invites/{token}:resend:
    post:
      summary: Отправить ещё раз — новый токен и срок, старый перестаёт работать
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: Новое приглашение }
  /v1/staff/{id}:
    patch:
      summary: Администратор меняет статус (active/blocked) и отметку проверки по ФРМР
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { status: { type: string, enum: [active, blocked] }, frmrChecked: { type: boolean } }, additionalProperties: false }
      responses:
        '200': { description: Обновлено }
  /v1/patients/{id}/bookings:
    post:
      summary: Заявка на запись к психологу или психиатру (чат-бот пациента или психолог). Открытая заявка к тому же специалисту дополняется.
      parameters: [{ $ref: '#/components/parameters/PatientId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, clientId]
              properties:
                to: { type: string, enum: [psychologist, psychiatrist, unsure] }
                when: { type: string, enum: [soon, morning, evening, any], default: any }
                note: { type: string, maxLength: 500 }
                urgent: { type: boolean, description: только от психолога — «записать к психиатру раньше» }
                clientId: { type: string, description: ключ идемпотентности очереди отправки }
      responses:
        '201': { description: Заявка создана }
        '200': { description: Повтор или дополнение открытой заявки }
  /v1/bookings:
    get:
      summary: Заявки клиники для администратора — имя, телефон, пожелание, без медицинских данных
      parameters: [{ name: status, in: query, schema: { type: string, enum: [new, scheduled, declined] } }]
      responses:
        '200': { description: Список заявок }
  /v1/bookings/{id}:schedule:
    post:
      summary: Администратор записывает пациента; подтверждение уходит в чат-бот
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [at, specialist], properties: { at: { type: string, format: date-time }, specialist: { type: string } } }
      responses:
        '200': { description: Записано }
        '409': { description: Заявка уже обработана }
  /v1/bookings/{id}:decline:
    post:
      summary: Администратор отказывает с причиной; ответ уходит в чат-бот
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3 } } }
      responses:
        '200': { description: Отказ отправлен }
        '409': { description: Заявка уже обработана }
components:
  securitySchemes:
    session: { type: http, scheme: bearer }
    webhookSecret: { type: apiKey, in: header, name: X-Webhook-Secret }
  parameters:
    PatientId: { name: id, in: path, required: true, schema: { type: string } }
  schemas:
    ChannelName: { type: string, enum: [max, telegram, web] }
    Channel:
      type: object
      properties:
        channel: { $ref: '#/components/schemas/ChannelName' }
        linkedAt: { type: string, format: date-time }
    Session:
      type: object
      properties:
        token: { type: string }
        patientId: { type: [string, 'null'], description: 'null — пациент ещё не привязан, нужен код приглашения' }
        expiresAt: { type: string, format: date-time }
    EventIn:
      type: object
      required: [clientId, type, payload]
      properties:
        clientId: { type: string, maxLength: 64 }
        type: { type: string, enum: [checkin, dose, scale, ae, change, sos, intake_form, cto] }
        at: { type: string, format: date-time, description: только для checkin, не раньше 7 дней }
        channel: { type: string, enum: [max, max-chat, telegram, web] }
        payload: { type: object, additionalProperties: true }
    Event:
      allOf:
        - $ref: '#/components/schemas/EventIn'
        - type: object
          properties:
            id: { type: string }
            recordedAt: { type: string, format: date-time }
    Bundle:
      type: object
      required: [format, version, patient, events]
      properties:
        format: { const: kompas-bundle }
        version: { const: 1 }
        exportedAt: { type: string, format: date-time }
        rulesVersion: { type: string }
        patient: { type: object, additionalProperties: true }
        channels: { type: array, items: { $ref: '#/components/schemas/Channel' } }
        consents: { type: array, items: { type: object, properties: { kind: { type: string }, at: { type: string }, version: { type: string } } } }
        events: { type: array, items: { $ref: '#/components/schemas/Event' } }
        messages: { type: array, items: { type: object } }
        decisions: { type: array, items: { type: object } }
